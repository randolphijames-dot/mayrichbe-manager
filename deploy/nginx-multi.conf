# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Social Manager - Nginx 主配置（多租户）
#  各用户的 server block 在 conf.d/ 目录下
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式（含用户子域名）
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'host=$host';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile    on;
    tcp_nopush  on;

    keepalive_timeout 65;

    # 全局上传大小限制
    client_max_body_size 500m;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # HTTP → HTTPS 自动跳转
    server {
        listen 80;
        server_name *.sm.mayrichbe.cam sm.mayrichbe.cam;

        # Let's Encrypt 验证路径（申请/续期证书时用）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 其他请求全部跳转 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 默认 HTTPS server（未匹配的子域名返回 404）
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/sm.mayrichbe.cam/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sm.mayrichbe.cam/privkey.pem;

        return 404;
    }

    # 加载各用户的 server block
    include /etc/nginx/conf.d/*.conf;
}
