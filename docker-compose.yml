version: '3.8'

services:
  mayrichbe-manager:
    build: .
    container_name: mayrichbe-manager
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 持久化数据库
      - ./backend/social_manager.db:/app/social_manager.db
      # 持久化上传文件
      - ./backend/uploads:/app/uploads
      # 持久化instagrapi sessions
      - ./backend/instagrapi_sessions:/app/instagrapi_sessions
    environment:
      - TZ=Asia/Tokyo
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
